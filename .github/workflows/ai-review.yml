name: AI review

# Advisory AI review from venkatvghub/ai-review. The Together key is the repository secret
# TOGETHER_API_KEY; no other secret is needed.
#
#  - pull_request_target: review the changes since the last review (the first push reviews it all)
#  - issue_comment by a member: /ai-review (again) | rest | part N | full (the whole PR)
#  - workflow_dispatch: the same from the Actions tab
#
# pull_request_target runs this file from the default branch, never from the PR, and the action
# only fetches the PR head as git data. Do not add a checkout of the PR head to this job.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - docs/**
      - '**.md'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
      part:
        description: 'Part of a large diff to review (1 is the first, 2 the rest)'
        default: '1'
      debug:
        description: Verbose log
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request_target'
        && github.event.pull_request.draft == false
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && startsWith(github.event.comment.body, '/ai-review')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    continue-on-error: true
    steps:
      # Pin a commit SHA of venkatvghub/ai-review (replace main) once you have one you trust.
      - uses: venkatvghub/ai-review@main
        with:
          profile: privatebin-go
          together-api-key: ${{ secrets.TOGETHER_API_KEY }}
          pr-number: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          command: ${{ github.event.comment.body }}
          part: ${{ inputs.part }}
          debug: ${{ inputs.debug || vars.REVIEW_DEBUG }}
          model: ${{ vars.REVIEW_MODEL }}
          reasoning-effort: ${{ vars.REVIEW_REASONING_EFFORT }}
          token-budget: ${{ vars.REVIEW_TOKEN_BUDGET }}
          time-budget-seconds: ${{ vars.REVIEW_TIME_BUDGET_SECONDS }}
