name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: privatebin
          POSTGRES_PASSWORD: privatebin
          POSTGRES_DB: privatebin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U privatebin" --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://privatebin:privatebin@localhost:5432/privatebin?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
