name: privatebin-go

# Postgres only (plus Dex under the "auth" profile). The app itself runs on the host:
# `make run` or `go run ./cmd/privatebin-go`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-privatebin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-privatebin}
      POSTGRES_DB: ${POSTGRES_DB:-privatebin}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  dex:
    profiles: ["auth"]
    image: ghcr.io/dexidp/dex:v2.46.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "5556:5556"

volumes:
  pgdata:
